name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://atlas:atlas_ci_password@localhost:5432/engineering_atlas_ci?schema=public

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: engineering_atlas_ci
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d engineering_atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm install

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
